# Render Infrastructure as Code Blueprint
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: querypilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: BENCHMARK_ENABLED
        value: "false"
      - key: DAILY_LLM_CALL_CAP
        value: "200"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      # Secrets to be provided in Render Dashboard or via blueprint sync
      - key: CORS_ORIGINS
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: SHOP_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

